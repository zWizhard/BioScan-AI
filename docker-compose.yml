services:
  api:
    build: .
    image: bioscan-ai:dev
    container_name: bioscan-api
    ports:
      - "8000:8000"
    # Variáveis de ambiente do .env (copie de .env.example antes de subir).
    env_file:
      - .env
    environment:
      # Sobrescreve a DATABASE_URL para apontar ao volume persistente (/data),
      # mantendo o seed JSON imutável dentro da imagem em /app/data.
      DATABASE_URL: "sqlite+aiosqlite:////data/bioscan.db"
      APP_PORT: "8000"
    volumes:
      # Persiste o banco SQLite entre recriações do container.
      - bioscan-db:/data
    healthcheck:
      # python já está na imagem; evita depender de curl no slim.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  bioscan-db:
